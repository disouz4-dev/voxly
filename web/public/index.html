<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voxly - Login</title>
  <style>
    @font-face { font-family:'Sora';       src:url('assets/fonts/Sora.ttf')       format('truetype'); font-weight:100 800; font-display:swap; }
    @font-face { font-family:'Unbounded';  src:url('assets/fonts/Unbounded.ttf')  format('truetype'); font-weight:100 900; font-display:swap; }
    @font-face { font-family:'Space Mono'; src:url('assets/fonts/SpaceMono-Regular.ttf') format('truetype'); font-weight:400; font-display:swap; }
    @font-face { font-family:'Space Mono'; src:url('assets/fonts/SpaceMono-Bold.ttf')    format('truetype'); font-weight:700; font-display:swap; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sora', system-ui, sans-serif;
      background:
        radial-gradient(110% 70% at 85% -10%, #1b1626 0%, transparent 55%),
        radial-gradient(90% 60% at 0% 110%, #0e1c22 0%, transparent 55%),
        #0b0c11;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; color: #ece7dd;
    }
    ::selection { background:#ffb454; color:#1c1206; }
    .container {
      position: relative;
      background: rgba(18,20,27,.72);
      padding: 40px; border-radius: 22px;
      width: 100%; max-width: 400px;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
      border: 1px solid #262b37;
      overflow: hidden;
    }
    .container::before {
      content:""; position:absolute; left:0; top:0; width:26px; height:26px;
      border-left:2px solid #ffb454; border-top:2px solid #ffb454;
      border-top-left-radius:22px; pointer-events:none;
    }
    .logo-container { display: flex; justify-content: center; align-items: center; margin-bottom: 30px; width: 100%; height: 200px; }
    .logo-container img { max-height: 100%; max-width: 100%; height: auto; display: block; }
    .subtitle { text-align: center; color: #8d93a4; margin-bottom: 30px; font-size: .98rem; font-family:'Space Mono', monospace; letter-spacing:.06em; }
    .login-methods { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    .btn { display: block; width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: .95rem; font-weight: 600; letter-spacing:.02em; font-family:'Sora'; cursor: pointer; transition: all 0.2s; text-align: center; }
    .google-btn { background:#ffffff; color:#000000; display:flex; align-items:center; justify-content:center; gap:10px; }
    .google-btn:hover { filter:brightness(.95); transform: translateY(-2px); }
    .google-icon { width: 24px; height: 24px; }
    .email-btn { background: linear-gradient(135deg,#58c4dd,#2f93ab); color:#06242c; }
    .email-btn:hover { filter:brightness(1.07); transform: translateY(-2px); }
    .back-btn { background:#1a1d26; color:#ece7dd; border:1px solid #262b37; }
    .back-btn:hover { background:#22262f; transform: translateY(-2px); }
    .or-divider { text-align: center; margin: 20px 0; color: #8d93a4; font-size: .78rem; font-family:'Space Mono',monospace; position: relative; }
    .or-divider::before, .or-divider::after { content: ""; border-bottom: 1px solid #262b37; position: absolute; top: 50%; width: 45%; }
    .or-divider::before { left: 0; }
    .or-divider::after { right: 0; }
    .or-divider span { position: relative; padding: 0 10px; background: #12141b; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size:.82rem; color: #ece7dd; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #262b37; border-radius: 10px; background: rgba(255,255,255,0.05); color: #ece7dd; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: #ffb454; }
    .footer { margin-top: 30px; text-align: center; color: #8d93a4; font-size: .8rem; font-family:'Space Mono',monospace; }
    .footer strong { color:#ffb454; text-transform:uppercase; letter-spacing:.08em; }
    .footer a { color: #58c4dd; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="assets/logo/logo_voxly.png" alt="Voxly Logo">
    </div>
    <div class="subtitle">Conecte vozes. Compartilhe momentos.</div>

    <div class="login-methods" id="login-methods">
      <button id="google-login" class="btn google-btn">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" class="google-icon">
        Entrar com Google
      </button>
      <div class="or-divider"><span>OU</span></div>
      <button id="email-login" class="btn email-btn">Entrar com E-mail</button>
      <button id="signup-login" class="btn email-btn">Cadastrar</button>
    </div>

    <div id="email-form" style="display:none;">
      <div class="form-group"><label>E-mail</label><input type="email" id="email" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="password" placeholder="••••••••"></div>
      <button id="submit-email" class="btn email-btn">Entrar</button>
      <button id="back-to-choices" class="btn back-btn" style="margin-top:10px;">Voltar</button>
      <div id="email-error" style="color:#ff1744;text-align:center;margin-top:10px;display:none;"></div>
    </div>

    <div id="signup-form" style="display:none;">
      <div class="form-group"><label>E-mail</label><input type="email" id="signup-email" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="signup-password" placeholder="••••••••"></div>
      <button id="submit-signup" class="btn email-btn">Cadastrar</button>
      <button id="back-from-signup" class="btn back-btn" style="margin-top:10px;">Voltar</button>
      <div id="signup-error" style="color:#ff1744;text-align:center;margin-top:10px;display:none;"></div>
    </div>

    <div class="footer">
      Desenvolvido por <strong>diSouz4</strong> para <strong>Nexus Solutions</strong><br>
      <a href="#" onclick="alert('Versão 1.0.0 - © 2026 Nexus Solutions')">Versão</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyB5sPKpmPVWDDhwprU8TB0Bn0N0WSiafoI",
      authDomain: "voxly-karaoke.firebaseapp.com",
      projectId: "voxly-karaoke",
      storageBucket: "voxly-karaoke.firebasestorage.app",
      messagingSenderId: "689541919299",
      appId: "1:689541919299:web:92e70bbd3a1a2709d5daf6"
    });

    const auth = firebase.auth();
    const db   = firebase.firestore();

    async function redirectByProfile(user) {
      const doc = await db.collection('cantores').doc(user.uid).get();
      window.location.href = doc.exists ? '/profile.html' : '/signup.html';
    }

    const loginMethods      = document.getElementById('login-methods');
    const googleLoginButton = document.getElementById('google-login');
    const emailLoginButton  = document.getElementById('email-login');
    const signupLoginButton = document.getElementById('signup-login');
    const emailForm         = document.getElementById('email-form');
    const signupForm        = document.getElementById('signup-form');
    const submitEmailButton = document.getElementById('submit-email');
    const submitSignupButton= document.getElementById('submit-signup');
    const emailError        = document.getElementById('email-error');
    const signupError       = document.getElementById('signup-error');
    const emailInput        = document.getElementById('email');
    const passwordInput     = document.getElementById('password');
    const signupEmailInput  = document.getElementById('signup-email');
    const signupPasswordInput=document.getElementById('signup-password');
    const backToChoices     = document.getElementById('back-to-choices');
    const backFromSignup    = document.getElementById('back-from-signup');

    function showMethods() { loginMethods.style.display = 'flex'; }
    function hideMethods() { loginMethods.style.display = 'none'; }

    let signingIn = false;
    googleLoginButton.addEventListener('click', () => {
      if (signingIn) return;
      signingIn = true;
      googleLoginButton.disabled = true;
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(r => redirectByProfile(r.user))
        .catch(e => {
          if (e.code !== 'auth/cancelled-popup-request' && e.code !== 'auth/popup-closed-by-user')
            alert('Erro Google: ' + e.message);
        })
        .finally(() => { signingIn = false; googleLoginButton.disabled = false; });
    });

    emailLoginButton.addEventListener('click', () => { hideMethods(); emailForm.style.display='block'; emailInput.focus(); });
    backToChoices.addEventListener('click', () => { emailForm.style.display='none'; emailError.style.display='none'; showMethods(); });
    submitEmailButton.addEventListener('click', () => {
      const email=emailInput.value.trim(), pass=passwordInput.value;
      if (!email||!pass) { showErr(emailError,'Preencha todos os campos.'); return; }
      emailError.style.display='none';
      submitEmailButton.disabled=true; submitEmailButton.textContent='Entrando...';
      auth.signInWithEmailAndPassword(email,pass)
        .then(c=>redirectByProfile(c.user))
        .catch(e=>showErr(emailError,{'auth/user-not-found':'Usuário não encontrado.','auth/wrong-password':'Senha incorreta.','auth/invalid-credential':'E-mail ou senha incorretos.'}[e.code]||'Erro ao entrar.'))
        .finally(()=>{ submitEmailButton.disabled=false; submitEmailButton.textContent='Entrar'; });
    });

    signupLoginButton.addEventListener('click', () => { hideMethods(); signupForm.style.display='block'; signupEmailInput.focus(); });
    backFromSignup.addEventListener('click', () => { signupForm.style.display='none'; signupError.style.display='none'; showMethods(); });
    submitSignupButton.addEventListener('click', () => {
      const email=signupEmailInput.value.trim(), pass=signupPasswordInput.value;
      if (!email||!pass) { showErr(signupError,'Preencha todos os campos.'); return; }
      signupError.style.display='none';
      submitSignupButton.disabled=true; submitSignupButton.textContent='Cadastrando...';
      auth.createUserWithEmailAndPassword(email,pass)
        .then(c=>redirectByProfile(c.user))
        .catch(e=>showErr(signupError,e.message))
        .finally(()=>{ submitSignupButton.disabled=false; submitSignupButton.textContent='Cadastrar'; });
    });

    function showErr(el,msg) { el.textContent=msg; el.style.display='block'; }
  </script>
</body>
</html>
