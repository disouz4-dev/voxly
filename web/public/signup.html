<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voxly - Cadastro</title>
  <style>
    @font-face { font-family:'Sora';       src:url('assets/fonts/Sora.ttf')       format('truetype'); font-weight:100 800; font-display:swap; }
    @font-face { font-family:'Unbounded';  src:url('assets/fonts/Unbounded.ttf')  format('truetype'); font-weight:100 900; font-display:swap; }
    @font-face { font-family:'Space Mono'; src:url('assets/fonts/SpaceMono-Regular.ttf') format('truetype'); font-weight:400; font-display:swap; }
    @font-face { font-family:'Space Mono'; src:url('assets/fonts/SpaceMono-Bold.ttf')    format('truetype'); font-weight:700; font-display:swap; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sora', system-ui, sans-serif;
      background:
        radial-gradient(110% 70% at 85% -10%, #1b1626 0%, transparent 55%),
        radial-gradient(90% 60% at 0% 110%, #0e1c22 0%, transparent 55%),
        #0b0c11;
      color: #ece7dd; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    ::selection { background:#ffb454; color:#1c1206; }
    .container {
      position: relative;
      background: rgba(18,20,27,.75);
      padding: 30px; border-radius: 20px;
      max-width: 500px; width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
      border: 1px solid #262b37; overflow: hidden;
    }
    .container::before {
      content:""; position:absolute; left:0; top:0; width:26px; height:26px;
      border-left:2px solid #ffb454; border-top:2px solid #ffb454;
      border-top-left-radius:20px; pointer-events:none;
    }
    .logo-container { display: flex; justify-content: center; margin-bottom: 20px; height: 100px; }
    .logo-container img { max-height: 100%; display: block; }

    /* Avatar preview */
    .avatar-preview {
      display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;
    }
    .avatar-circle {
      width: 90px; height: 90px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 700; color: #fff;
      margin-bottom: 8px; overflow: hidden; border: 3px solid #ffb454;
      box-shadow: 0 0 22px rgba(255,180,84,.22);
    }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-label { font-family:'Space Mono', monospace; font-size: .68rem; letter-spacing:.08em; color: #8d93a4; }

    h2 { text-align: center; margin-bottom: 20px; font-size: 1.25rem; font-family:'Unbounded', sans-serif; font-weight:600; letter-spacing:.02em; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #b9becd; font-size: .82rem; font-weight:600; }
    input[type=text], input[type=date], select {
      width: 100%; padding: 10px; border-radius: 9px; border: 1px solid #262b37;
      background: rgba(255,255,255,0.05); color: #ece7dd; font-size: 1rem;
      font-family: 'Sora', sans-serif;
    }
    input[type=text]:focus, input[type=date]:focus, select:focus { outline: none; border-color: #ffb454; }
    select option { background: #1a1d26; }
    .genre-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
    .genre-btn {
      background: #1a1d26; color: #ece7dd; border: 1px solid #262b37;
      border-radius: 999px; padding: 7px 14px; cursor: pointer;
      font-family:'Space Mono', monospace; font-size: .74rem; transition: all 0.2s;
    }
    .genre-btn:hover { background: #22262f; }
    .genre-btn.selected { background: linear-gradient(135deg,#ffb454,#e0932e); border-color: #ffb454; color: #241608; font-weight:700; }
    .genre-count { font-family:'Space Mono', monospace; font-size: .72rem; color: #8d93a4; margin-top: 5px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; color: #b9becd; cursor: pointer; font-weight:400; }
    .checkbox-label input { width: auto; }
    .btn { width: 100%; padding: 13px; background: linear-gradient(135deg,#58c4dd,#2f93ab); color: #06242c; border: none; border-radius: 11px; cursor: pointer; font-family:'Sora'; font-weight:600; font-size: .95rem; margin-top: 10px; letter-spacing:.02em; transition: filter 0.2s, transform 0.2s; }
    .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .btn.back { background: #1a1d26; color: #ece7dd; border: 1px solid #262b37; }
    .btn.back:hover { background: #22262f; }
    .error { color: #ff6b6b; margin-top: 5px; font-size: .85rem; font-family:'Space Mono', monospace; }
    .footer { margin-top: 20px; text-align: center; font-size: .78rem; font-family:'Space Mono', monospace; color: #8d93a4; }
    .footer a { color: #58c4dd; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="assets/logo/logo_voxly.png" alt="Voxly Logo">
    </div>
    <h2>Criar Perfil de Cantor(a)</h2>

    <div class="avatar-preview">
      <div class="avatar-circle" id="avatarCircle">?</div>
      <span class="avatar-label" id="avatarLabel">Sua foto aparecerá aqui</span>
    </div>

    <div class="field">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" placeholder="Seu nome completo">
    </div>
    <div class="field">
      <label for="nomeArtistico">Nome Artístico</label>
      <input type="text" id="nomeArtistico" placeholder="Como quer ser chamado(a) no palco">
    </div>

    <div class="field">
      <label>Gêneros Musicais <span style="color:#888;font-size:0.8rem;">(máx. 5)</span></label>
      <div class="genre-container" id="genreContainer">
        <button type="button" class="genre-btn" data-genre="Pop">Pop</button>
        <button type="button" class="genre-btn" data-genre="Rock">Rock</button>
        <button type="button" class="genre-btn" data-genre="Samba">Samba</button>
        <button type="button" class="genre-btn" data-genre="MPB">MPB</button>
        <button type="button" class="genre-btn" data-genre="Funk">Funk</button>
        <button type="button" class="genre-btn" data-genre="Sertanejo">Sertanejo</button>
        <button type="button" class="genre-btn" data-genre="Pagode">Pagode</button>
        <button type="button" class="genre-btn" data-genre="Forró">Forró</button>
        <button type="button" class="genre-btn" data-genre="Axé">Axé</button>
        <button type="button" class="genre-btn" data-genre="Eletrônica">Eletrônica</button>
        <button type="button" class="genre-btn" data-genre="Hip-Hop">Hip-Hop</button>
        <button type="button" class="genre-btn" data-genre="Jazz">Jazz</button>
        <button type="button" class="genre-btn" data-genre="Reggaeton">Reggaeton</button>
        <button type="button" class="genre-btn" data-genre="Country">Country</button>
        <button type="button" class="genre-btn" data-genre="Blues">Blues</button>
        <button type="button" class="genre-btn" data-genre="R&B">R&B</button>
        <button type="button" class="genre-btn" data-genre="Soul">Soul</button>
        <button type="button" class="genre-btn" data-genre="Clássico">Clássico</button>
        <button type="button" class="genre-btn" data-genre="Reggae">Reggae</button>
        <button type="button" class="genre-btn" data-genre="Metal">Metal</button>
        <button type="button" class="genre-btn" data-genre="Gospel">Gospel</button>
        <button type="button" class="genre-btn" data-genre="Outros">Outros</button>
      </div>
      <div class="genre-count" id="genreCount">0 de 5 selecionados</div>
      <div id="genreError" class="error"></div>
    </div>

    <div class="field">
      <label for="genderIdentity">Identidade de Gênero</label>
      <select id="genderIdentity">
        <option value="">Prefiro não informar</option>
        <option value="homem">Homem</option>
        <option value="mulher">Mulher</option>
        <option value="nao-binario">Não-Binário</option>
        <option value="transgenero-masc">Homem Transgênero</option>
        <option value="transgenero-fem">Mulher Transgênero</option>
        <option value="genero-fluido">Gênero Fluido</option>
        <option value="outro">Outro</option>
      </select>
    </div>

    <div class="field">
      <label for="birthdate">Data de Nascimento</label>
      <input type="date" id="birthdate">
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="showAge"> Mostrar idade no perfil
      </label>
    </div>

    <button id="cadastrar" class="btn">Cadastrar</button>
    <button id="voltar" class="btn back">Voltar</button>
    <div id="msg" class="error" style="text-align:center;margin-top:10px;"></div>

    <footer class="footer">
      <a href="https://github.com/dim-dev/voxly-karaoke" target="_blank">Código Fonte</a> • © 2026 Voxly
    </footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyB5sPKpmPVWDDhwprU8TB0Bn0N0WSiafoI",
      authDomain: "voxly-karaoke.firebaseapp.com",
      projectId: "voxly-karaoke",
      storageBucket: "voxly-karaoke.firebasestorage.app",
      messagingSenderId: "689541919299",
      appId: "1:689541919299:web:92e70bbd3a1a2709d5daf6"
    });

    const auth = firebase.auth();
    const db   = firebase.firestore();

    // Cores para avatar por iniciais
    const avatarColors = ['#e040fb','#7c4dff','#4285f4','#00bcd4','#00e676','#ff9100','#ff5252'];
    function getAvatarColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      return avatarColors[Math.abs(hash) % avatarColors.length];
    }
    function getInitials(name) {
      return name.trim().split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) || '?';
    }

    // Atualiza preview do avatar
    let currentUser = null;
    auth.onAuthStateChanged(u => {
      if (!u) { window.location.href = '/index.html'; return; }
      currentUser = u;
      updateAvatarPreview('');
    });

    const nomeArtisticoInput = document.getElementById('nomeArtistico');
    nomeArtisticoInput.addEventListener('input', () => updateAvatarPreview(nomeArtisticoInput.value));

    function updateAvatarPreview(nomeArtistico) {
      const circle = document.getElementById('avatarCircle');
      const label  = document.getElementById('avatarLabel');

      if (currentUser && currentUser.photoURL) {
        circle.innerHTML = `<img src="${currentUser.photoURL}" alt="foto">`;
        label.textContent = 'Foto do Google';
      } else if (nomeArtistico.trim()) {
        const initials = getInitials(nomeArtistico);
        const color    = getAvatarColor(nomeArtistico);
        circle.innerHTML = initials;
        circle.style.background = color;
        label.textContent = 'Avatar com suas iniciais';
      } else {
        circle.innerHTML = '?';
        circle.style.background = '#333';
        label.textContent = 'Digite seu nome artístico';
      }
    }

    // Gêneros musicais
    const genreContainer = document.getElementById('genreContainer');
    const genreError     = document.getElementById('genreError');
    const genreCount     = document.getElementById('genreCount');

    genreContainer.addEventListener('click', e => {
      if (!e.target.classList.contains('genre-btn')) return;
      const btn = e.target;
      const selected = document.querySelectorAll('.genre-btn.selected');
      if (btn.classList.contains('selected')) {
        btn.classList.remove('selected');
        genreError.textContent = '';
      } else if (selected.length < 5) {
        btn.classList.add('selected');
        genreError.textContent = '';
      } else {
        genreError.textContent = 'Selecione no máximo 5 gêneros.';
      }
      genreCount.textContent = document.querySelectorAll('.genre-btn.selected').length + ' de 5 selecionados';
    });

    // Cadastrar
    document.getElementById('cadastrar').addEventListener('click', async () => {
      const nome          = document.getElementById('nome').value.trim();
      const nomeArtistico = nomeArtisticoInput.value.trim();
      const gender        = document.getElementById('genderIdentity').value;
      const birthdate     = document.getElementById('birthdate').value;
      const showAge       = document.getElementById('showAge').checked;
      const msg           = document.getElementById('msg');
      const selectedGenres= [...document.querySelectorAll('.genre-btn.selected')].map(b => b.dataset.genre);

      if (!nome || !nomeArtistico || !birthdate) {
        msg.textContent = 'Nome, nome artístico e data de nascimento são obrigatórios.';
        return;
      }
      if (selectedGenres.length === 0) {
        genreError.textContent = 'Selecione ao menos um gênero musical.';
        return;
      }

      const user = auth.currentUser;
      if (!user) { msg.textContent = 'Usuário não autenticado.'; return; }

      // Define photoURL: foto Google ou avatar em base64
      let photoURL = user.photoURL || null;
      if (!photoURL) {
        // Gera avatar SVG com iniciais
        const initials = getInitials(nomeArtistico);
        const color    = getAvatarColor(nomeArtistico);
        photoURL = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="50" fill="${encodeURIComponent(color)}"/><text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="40" font-weight="bold" fill="white">${initials}</text></svg>`;
      }

      const btn = document.getElementById('cadastrar');
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        await db.collection('cantores').doc(user.uid).set({
          nomeCompleto:   nome,
          nomeArtistico:  nomeArtistico,
          generos:        selectedGenres,
          genderIdentity: gender,
          birthDate:      firebase.firestore.Timestamp.fromDate(new Date(birthdate)),
          showAge:        showAge,
          photoURL:       photoURL,
          email:          user.email,
          createdAt:      firebase.firestore.FieldValue.serverTimestamp()
        });
        window.location.href = '/profile.html';
      } catch(e) {
        console.error(e);
        msg.textContent = e.message || 'Falha ao cadastrar.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Cadastrar';
      }
    });

    document.getElementById('voltar').addEventListener('click', () => {
      window.location.href = '/index.html';
    });
  </script>
</body>
</html>
