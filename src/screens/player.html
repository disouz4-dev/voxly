<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #video-player {
      width: 100%; height: 100%;
      object-fit: contain;
      display: none;
    }
    #idle-screen {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, #1a0033 0%, #000 70%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
    }
    #idle-screen img { height: 350px; width: auto; display: block; }
    #idle-sub { font-size: 1.2rem; color: #ffffff80; }
    .qr-corner {
      position: absolute; bottom: 20px; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .qr-corner-label {
      font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase;
      color: #ffffff70; font-weight: 700;
      background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 4px;
    }
    .qr-corner img {
      width: 130px; height: 130px;
      background: #fff; padding: 4px; box-sizing: content-box;
      border-radius: 4px;
    }
    #qr-app    { left: 20px; }
    #qr-sessao { right: 20px; display: none; }
    .footer {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      padding: 8px 16px;
      color: #ffffff40; font-size: .7rem;
      text-align: center;
    }
    .footer strong { color: #e040fb; }

    /* ── Preview overlay (confirmação 15s) ── */
    #preview-overlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.85);
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 20;
    }
    #preview-overlay.active { display: flex; }
    .preview-label { font-size: 0.9rem; color: #e040fb; letter-spacing: 2px; text-transform: uppercase; }
    .preview-song  { font-size: 2rem; font-weight: 700; text-align: center; }
    .preview-artist{ font-size: 1.2rem; color: #7a7a9d; }
    .preview-singer{ font-size: 1rem; color: #e040fb; }
    .timer-circle {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 6px solid #7c4dff;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 700;
      position: relative;
    }
    .timer-circle.urgente { border-color: #ff1744; color: #ff1744; }
    .preview-msg { font-size: 1rem; color: #ffffff80; text-align: center; }

    /* ── Intro animação ── */
    #intro-overlay {
      display: none;
      position: absolute; inset: 0; z-index: 30;
      background: #000;
      flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }
    #intro-overlay.active { display: flex; }

    /* fundo com partículas de luz */
    #intro-overlay::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 50%, #3d006680 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 80%, #00b4d820 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 20%, #e040fb20 0%, transparent 60%);
    }

    /* linha de brilho horizontal que varre a tela */
    #intro-overlay::after {
      content: '';
      position: absolute;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, transparent, #e040fb, #7c4dff, #e040fb, transparent);
      animation: sweep 1.6s ease-in-out forwards;
      top: 50%;
    }
    @keyframes sweep {
      from { transform: translateY(-200px); opacity: 0; }
      20%  { opacity: 1; }
      to   { transform: translateY(200px); opacity: 0; }
    }

    .intro-badge {
      font-size: 0.75rem; letter-spacing: 4px; text-transform: uppercase;
      color: #e040fb; margin-bottom: 20px;
      animation: fadeSlideDown .5s ease .2s both;
    }
    .intro-avatars {
      display: flex; align-items: center; gap: 20px;
      animation: popIn .45s cubic-bezier(.17,.67,.35,1.4) .3s both;
    }
    .intro-avatar {
      width: 130px; height: 130px; border-radius: 50%;
      object-fit: cover;
      border: 4px solid #e040fb;
      box-shadow: 0 0 30px #e040fb60, 0 0 60px #7c4dff40;
    }
    .intro-avatar-placeholder {
      width: 130px; height: 130px; border-radius: 50%;
      background: linear-gradient(135deg, #3d0066, #7c4dff);
      border: 4px solid #e040fb;
      box-shadow: 0 0 30px #e040fb60;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; font-weight: 900; color: #fff;
    }
    .intro-duo-vs {
      font-size: 2rem; color: #ffffff40; font-weight: 900;
      animation: popIn .3s ease .5s both;
    }
    .intro-names {
      margin-top: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .intro-name {
      font-size: clamp(2rem, 5vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      background: linear-gradient(135deg, #fff 30%, #e040fb 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeSlideUp .5s ease both;
    }
    .intro-name:nth-child(2) { animation-delay: .15s; }
    .intro-duo-sep {
      font-size: 0.9rem; color: #ffffff60; letter-spacing: 6px;
      animation: fadeSlideUp .4s ease .1s both;
    }
    .intro-song {
      margin-top: 24px; text-align: center;
      animation: fadeSlideUp .5s ease .35s both;
    }
    .intro-song-title {
      font-size: clamp(1.1rem, 2.5vw, 1.8rem); font-weight: 700; color: #fff;
    }
    .intro-song-artist {
      font-size: clamp(.85rem, 1.8vw, 1.2rem); color: #ffffff60; margin-top: 4px;
    }

    /* barra de progresso na parte inferior */
    #intro-progress {
      position: absolute; bottom: 0; left: 0;
      height: 4px;
      background: linear-gradient(90deg, #7c4dff, #e040fb);
      width: 0%;
      transition: width linear;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.3) rotate(-10deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div id="idle-screen">
    <img src="../assets/logo/logo_voxly.png" alt="Voxly">
    <div id="idle-sub">Aguardando próxima música...</div>
  </div>

  <video id="video-player" controls></video>
  <audio id="preview-audio" style="display:none;"></audio>

  <div id="preview-overlay">
    <div class="preview-label">🎤 Próxima Música</div>
    <div class="preview-song"  id="prev-song">—</div>
    <div class="preview-artist" id="prev-artist">—</div>
    <div class="preview-singer" id="prev-singer">—</div>
    <div class="timer-circle" id="timer-circle">15</div>
    <div class="preview-msg">Confirme no seu celular para cantar!</div>
  </div>

  <!-- Intro animação (aparece entre confirmação e vídeo) -->
  <div id="intro-overlay">
    <div class="intro-badge">🎵 Próximo no palco</div>
    <div class="intro-avatars" id="intro-avatars"></div>
    <div class="intro-names" id="intro-names"></div>
    <div class="intro-song">
      <div class="intro-song-title" id="intro-song-title"></div>
      <div class="intro-song-artist" id="intro-song-artist"></div>
    </div>
    <div id="intro-progress"></div>
  </div>

  <div class="qr-corner" id="qr-app">
    <img id="qrImgApp" src="" alt="QR App">
    <div class="qr-corner-label">📱 Acesse o App</div>
  </div>

  <div class="qr-corner" id="qr-sessao">
    <img id="qrImgSessao" src="" alt="QR Sessão">
    <div class="qr-corner-label">🎤 Entre na Sessão</div>
  </div>

  <footer class="footer">
    Desenvolvido por <strong>diSouz4</strong> para <strong>Nexus Solutions</strong>
  </footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const video = document.getElementById("video-player");
  const idle  = document.getElementById("idle-screen");
  const introOverlay  = document.getElementById("intro-overlay");
  const introProgress = document.getElementById("intro-progress");

  const INTRO_DURATION = 4000; // ms que a animação fica na tela
  let introTimeout = null;

  function toFileUrl(filePath) {
    return encodeURI("file://" + filePath);
  }

  function avatarHtml(nome, url) {
    if (url) return `<img class="intro-avatar" src="${url}" alt="${nome}">`;
    const inicial = (nome || '?')[0].toUpperCase();
    return `<div class="intro-avatar-placeholder">${inicial}</div>`;
  }

  function mostrarIntro(cantor, duo, musica, artista, photoURL, duoPhotoURL, onDone) {
    // Avatares
    const avatarsEl = document.getElementById("intro-avatars");
    if (duo) {
      avatarsEl.innerHTML = avatarHtml(cantor, photoURL) +
        `<div class="intro-duo-vs">&amp;</div>` +
        avatarHtml(duo, duoPhotoURL);
    } else {
      avatarsEl.innerHTML = avatarHtml(cantor, photoURL);
    }

    // Nomes
    const namesEl = document.getElementById("intro-names");
    if (duo) {
      namesEl.innerHTML = `
        <div class="intro-name">${cantor}</div>
        <div class="intro-duo-sep">&amp;</div>
        <div class="intro-name">${duo}</div>`;
    } else {
      namesEl.innerHTML = `<div class="intro-name">${cantor}</div>`;
    }
    document.getElementById("intro-song-title").textContent  = musica  || "";
    document.getElementById("intro-song-artist").textContent = artista || "";

    // Barra de progresso
    introProgress.style.transition = "none";
    introProgress.style.width = "0%";
    introOverlay.classList.add("active");
    // Força reflow para a transição funcionar
    introProgress.getBoundingClientRect();
    introProgress.style.transition = `width ${INTRO_DURATION}ms linear`;
    introProgress.style.width = "100%";

    clearTimeout(introTimeout);
    introTimeout = setTimeout(() => {
      introOverlay.classList.remove("active");
      onDone();
    }, INTRO_DURATION);
  }

  // QR do app — sempre visível
  const APP_URL = "https://voxly-karaoke.web.app";
  document.getElementById("qrImgApp").src =
    `https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(APP_URL)}`;

  // Play video (canal legado)
  window.electronAPI.onPlayVideo(filePath => {
    console.log("[PLAYER] Recebeu:", filePath);
    idle.style.display  = "none";
    video.style.display = "block";
    video.src = toFileUrl(filePath);
    video.load();
    video.play().catch(e => console.error("[PLAYER] Erro ao tocar:", e));
  });

  const previewOverlay = document.getElementById("preview-overlay");
  const previewAudio   = document.getElementById("preview-audio");
  const timerCircle    = document.getElementById("timer-circle");
  let timerInterval    = null;

  function pararPreview() {
    previewAudio.pause();
    previewAudio.src = "";
    previewOverlay.classList.remove("active");
    clearInterval(timerInterval);
  }

  function iniciarVideo(filePath) {
    idle.style.display  = "none";
    video.style.display = "block";
    video.pause();
    video.removeAttribute("src");
    video.load();
    video.src = toFileUrl(filePath);
    video.load();
    video.play().catch(e => console.error("[PLAYER] Erro:", e));
  }

  // Comandos do host
  window.electronAPI.onPlayerCmd(cmd => {
    console.log("[PLAYER] Comando:", cmd);

    if (cmd.startsWith("{")) {
      try {
        const dados = JSON.parse(cmd);

        if (dados.cmd === "sessao-iniciada") {
          const sessaoUrl = `${APP_URL}/profile.html?sessao=${dados.codigo}`;
          document.getElementById("qrImgSessao").src =
            `https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(sessaoUrl)}`;
          document.getElementById("qr-sessao").style.display = "flex";
          return;
        }

        if (dados.cmd === "preview") {
          document.getElementById("prev-song").textContent   = dados.musica  || "—";
          document.getElementById("prev-artist").textContent = dados.artista || "—";
          document.getElementById("prev-singer").textContent = "🎤 " + (dados.cantor || "—");
          previewOverlay.classList.add("active");

          if (dados.filePath) {
            previewAudio.src    = toFileUrl(dados.filePath) + "#t=30";
            previewAudio.volume = 0.3;
            previewAudio.play().catch(e => console.log("Preview audio:", e));
          }

          let segundos = dados.segundos || 15;
          timerCircle.textContent = segundos;
          timerCircle.classList.remove("urgente");
          clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            segundos--;
            timerCircle.textContent = segundos;
            if (segundos <= 5) timerCircle.classList.add("urgente");
            if (segundos <= 0) { clearInterval(timerInterval); pararPreview(); }
          }, 1000);
        }

        if (dados.cmd === "play-confirmed") {
          pararPreview();
          mostrarIntro(
            dados.cantor      || "Cantor",
            dados.duo         || null,
            dados.musica      || "",
            dados.artista     || "",
            dados.photoURL    || null,
            dados.duoPhotoURL || null,
            () => iniciarVideo(dados.filePath)
          );
        }
      } catch(e) {
        console.error("[PLAYER] Erro JSON cmd:", e);
      }
      return;
    }

    if (cmd === "play")             video.play();
    if (cmd === "pause")            video.pause();
    if (cmd === "stop-preview")     pararPreview();
    if (cmd === "fullscreen")       document.documentElement.requestFullscreen?.();
    if (cmd === "sessao-encerrada") {
      document.getElementById("qr-sessao").style.display = "none";
      document.getElementById("qrImgSessao").src = "";
    }
    if (cmd === "stop") {
      pararPreview();
      clearTimeout(introTimeout);
      introOverlay.classList.remove("active");
      video.pause();
      video.removeAttribute("src");
      video.load();
      video.style.display = "none";
      idle.style.display  = "flex";
    }
  });

  // Ao terminar volta para idle e avisa o host
  video.addEventListener("ended", () => {
    console.log("[PLAYER] ended disparou!");
    video.style.display = "none";
    idle.style.display  = "flex";
    window.electronAPI.songEnded();
  });

  // Fallback: monitora o tempo e avisa quando terminar
  video.addEventListener("timeupdate", () => {
    if (video.duration && video.currentTime >= video.duration - 0.5) {
      if (video.style.display !== "none") {
        console.log("[PLAYER] Fim detectado por timeupdate");
        video.style.display = "none";
        idle.style.display  = "flex";
        window.electronAPI.songEnded();
      }
    }
  });
}); // DOMContentLoaded
</script>
</body>
</html>
