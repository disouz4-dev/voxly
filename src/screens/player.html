<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #video-player {
      width: 100%; height: 100%;
      object-fit: contain;
      display: none;
    }
    #idle-screen {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, #1a0033 0%, #000 70%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
    }
    #idle-screen img { height: 350px; width: auto; display: block; }
    #idle-sub { font-size: 1.2rem; color: #ffffff80; }
    .qr-corner {
      position: absolute; bottom: 20px; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .qr-corner-label {
      font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase;
      color: #ffffff70; font-weight: 700;
      background: rgba(0,0,0,0.5); padding: 3px 8px; border-radius: 4px;
    }
    .qr-corner img {
      width: 130px; height: 130px;
      background: #fff; padding: 4px; box-sizing: content-box;
      border-radius: 4px;
    }
    #qr-app    { left: 20px; }
    #qr-sessao { right: 20px; display: none; }
    .footer {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      padding: 8px 16px;
      color: #ffffff40; font-size: .7rem;
      text-align: center;
    }
    .footer strong { color: #e040fb; }

    /* ── Preview overlay (confirmação 15s) ── */
    #preview-overlay {
      display: none;
      position: absolute; inset: 0; z-index: 20;
      background: rgba(0,0,0,.92);
      backdrop-filter: blur(6px);
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
    }
    #preview-overlay.active { display: flex; }

    /* barra de waveform decorativa no topo */
    #prev-waveform {
      position: absolute; top: 0; left: 0; right: 0;
      height: 60px; display: flex; align-items: flex-end;
      gap: 3px; padding: 0 20px;
      overflow: hidden; opacity: .35;
    }
    .wave-bar {
      flex: 1; border-radius: 2px 2px 0 0;
      background: linear-gradient(to top, #7c4dff, #e040fb);
      animation: wavePulse .6s ease-in-out infinite alternate;
    }
    @keyframes wavePulse {
      from { transform: scaleY(.2); }
      to   { transform: scaleY(1); }
    }

    /* avatar no preview */
    #prev-avatars {
      display: flex; align-items: center; gap: 20px;
      margin-bottom: 18px;
    }
    .prev-avatar {
      width: 90px; height: 90px; border-radius: 50%;
      background-size: cover; background-position: center;
      background-color: #1a0033;
      border: 3px solid #e040fb80;
      box-shadow: 0 0 24px #e040fb40;
      animation: prevAvatarIn .5s cubic-bezier(.17,.67,.35,1.4) both;
    }
    .prev-avatar-placeholder {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #3d0066, #7c4dff);
      border: 3px solid #e040fb80;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; font-weight: 900;
      animation: prevAvatarIn .5s cubic-bezier(.17,.67,.35,1.4) both;
    }
    .prev-amp {
      font-size: 1.6rem; font-weight: 900;
      background: linear-gradient(135deg, #e040fb, #7c4dff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    @keyframes prevAvatarIn {
      from { opacity: 0; transform: scale(0) rotate(-10deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }

    .preview-label {
      font-size: .75rem; color: #e040fb; letter-spacing: 5px;
      text-transform: uppercase; margin-bottom: 6px;
      text-shadow: 0 0 20px #e040fb;
    }
    .preview-song   { font-size: clamp(1.6rem,3.5vw,2.8rem); font-weight: 800; text-align: center; margin-bottom: 4px; }
    .preview-artist { font-size: clamp(.9rem,1.8vw,1.3rem); color: #7a7a9d; margin-bottom: 6px; }
    .preview-singer {
      font-size: clamp(1rem,2vw,1.5rem); font-weight: 700;
      color: #e040fb; text-shadow: 0 0 20px #e040fb80; margin-bottom: 22px;
    }

    /* Timer */
    .timer-wrap {
      position: relative;
      width: 110px; height: 110px;
    }
    .timer-svg {
      position: absolute; inset: 0;
      transform: rotate(-90deg);
    }
    .timer-track { fill: none; stroke: #ffffff10; stroke-width: 6; }
    .timer-arc   {
      fill: none; stroke: #7c4dff; stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 314;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke .3s;
    }
    .timer-arc.urgente { stroke: #ff1744; }
    .timer-num {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.6rem; font-weight: 900;
    }
    .timer-num.urgente { color: #ff1744; }

    .preview-msg {
      margin-top: 14px; font-size: .9rem; color: #ffffff60; text-align: center;
    }

    /* barra de progresso da música no fundo */
    #prev-music-bar {
      position: absolute; bottom: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, #7c4dff, #e040fb);
      width: 0%; transition: width linear;
      opacity: .6;
    }

    /* ────────────────────────────────────────────
       INTRO ANIMAÇÃO
    ──────────────────────────────────────────── */
    #intro-overlay {
      display: none;
      position: absolute; inset: 0; z-index: 30;
      background: #000;
      flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }
    #intro-overlay.active { display: flex; }

    /* Fundo gradiente pulsante */
    #intro-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 140% 80% at 50% 130%, #3d006699 0%, #1a003344 50%, transparent 70%),
        radial-gradient(ellipse 60% 60% at 15% 85%, #00e5ff15 0%, transparent 60%),
        radial-gradient(ellipse 60% 60% at 85% 15%, #e040fb15 0%, transparent 60%),
        #000;
      animation: bgPulse 3s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      from { opacity: .85; }
      to   { opacity: 1; }
    }

    /* Raios de spotlight saindo do chão */
    #intro-rays {
      position: absolute; inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .intro-ray {
      position: absolute;
      bottom: -10%; left: 50%;
      width: 3px;
      height: 85%;
      background: linear-gradient(to top, #e040fb30, transparent);
      transform-origin: bottom center;
      animation: rayFade 3s ease-in-out infinite;
    }

    @keyframes rayFade {
      0%, 100% { opacity: 0; }
      50%       { opacity: 1; }
    }

    /* Linha de scan na entrada */
    #intro-scanline {
      position: absolute; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, #7c4dff 20%, #e040fb 50%, #00e5ff 80%, transparent 100%);
      box-shadow: 0 0 20px #e040fb, 0 0 40px #7c4dff;
      animation: scanDown .7s cubic-bezier(.4,0,.2,1) forwards;
      top: 0;
    }
    @keyframes scanDown {
      0%   { top: -3px; opacity: 0; }
      15%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Partículas */
    .intro-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFloat linear infinite;
      opacity: 0;
    }
    @keyframes particleFloat {
      0%   { transform: translateY(0) scale(0); opacity: 0; }
      10%  { opacity: .8; }
      85%  { opacity: .4; }
      100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
    }

    /* Flash de entrada */
    #intro-flash {
      position: absolute; inset: 0;
      background: #fff;
      animation: flashOut .4s ease forwards;
      pointer-events: none;
    }
    @keyframes flashOut {
      0%   { opacity: .25; }
      100% { opacity: 0; }
    }

    /* Badge topo */
    .intro-badge {
      position: relative; z-index: 5;
      font-size: .78rem; letter-spacing: 6px; text-transform: uppercase;
      color: #e040fb;
      text-shadow: 0 0 25px #e040fb;
      margin-bottom: 22px;
      animation: badgeIn .55s cubic-bezier(.17,.67,.35,1.3) .35s both;
    }
    @keyframes badgeIn {
      from { opacity: 0; transform: translateY(-40px); letter-spacing: 20px; }
      to   { opacity: 1; transform: translateY(0);     letter-spacing: 6px; }
    }

    /* Área de avatares */
    .intro-avatars {
      position: relative; z-index: 5;
      display: flex; align-items: center; gap: 36px;
    }

    /* Wrap individual do avatar */
    .intro-avatar-wrap {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .intro-avatar-wrap.solo {
      animation: avatarBurst .65s cubic-bezier(.17,.67,.35,1.5) .5s both;
    }
    .intro-avatar-wrap.duo-left {
      animation: avatarFromLeft .65s cubic-bezier(.17,.67,.35,1.3) .5s both;
    }
    .intro-avatar-wrap.duo-right {
      animation: avatarFromRight .65s cubic-bezier(.17,.67,.35,1.3) .62s both;
    }
    @keyframes avatarBurst {
      from { opacity: 0; transform: scale(0) rotate(-20deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes avatarFromLeft {
      from { opacity: 0; transform: translateX(-260px) scale(.4); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes avatarFromRight {
      from { opacity: 0; transform: translateX(260px) scale(.4); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* Anel giratório em volta do avatar */
    .intro-avatar-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(#e040fb, #7c4dff, #00e5ff, #e040fb);
      animation: ringSpin 2.5s linear infinite;
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 4px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 4px));
    }
    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }

    /* Anel de pulso */
    .intro-avatar-pulse {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 2px solid #e040fb40;
      animation: pulsering 1.8s ease-out infinite;
    }
    @keyframes pulsering {
      0%   { transform: scale(1);   opacity: .6; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    /* Foto/placeholder */
    .intro-avatar-img {
      width: 160px; height: 160px; border-radius: 50%;
      background-size: cover; background-position: center; background-color: #1a0033;
      box-shadow: 0 0 50px #e040fb40, 0 0 100px #7c4dff20;
    }
    .intro-avatar-placeholder {
      width: 160px; height: 160px; border-radius: 50%;
      background: linear-gradient(135deg, #3d0066 0%, #7c4dff 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 4.5rem; font-weight: 900; color: #fff;
      box-shadow: 0 0 50px #e040fb40;
    }

    /* & entre avatares */
    .intro-amp {
      font-size: 2.8rem; font-weight: 900;
      background: linear-gradient(135deg, #e040fb, #7c4dff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px #e040fb80);
      animation: ampPop .4s cubic-bezier(.17,.67,.35,1.5) .95s both;
    }
    @keyframes ampPop {
      from { opacity: 0; transform: scale(4) rotate(10deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* Nomes */
    .intro-names {
      position: relative; z-index: 5;
      margin-top: 22px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .intro-name {
      display: flex; justify-content: center; flex-wrap: wrap;
      font-size: clamp(2rem, 5.5vw, 4rem);
      font-weight: 900; letter-spacing: 3px;
      line-height: 1.1;
    }
    .intro-name-char {
      display: inline-block;
      background: linear-gradient(160deg, #fff 0%, #e040fb 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 10px #e040fb50);
      animation: charDrop .35s cubic-bezier(.17,.67,.35,1.4) both;
    }
    @keyframes charDrop {
      from { opacity: 0; transform: translateY(-60px) scale(1.8); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .intro-name-space { display: inline-block; width: .3em; }

    .intro-duo-sep {
      font-size: .8rem; color: #ffffff50; letter-spacing: 8px;
      text-transform: uppercase;
      animation: fadeUp .4s ease 1.15s both;
    }

    /* Linha divisória */
    .intro-divider {
      position: relative; z-index: 5;
      width: 0; height: 2px; margin: 20px auto 0;
      background: linear-gradient(90deg, transparent, #e040fb, #7c4dff, #00e5ff, transparent);
      box-shadow: 0 0 12px #e040fb80;
      animation: divExpand .5s ease 1.5s both;
    }
    @keyframes divExpand {
      from { width: 0; opacity: 0; }
      to   { width: 200px; opacity: 1; }
    }

    /* Música */
    .intro-song {
      position: relative; z-index: 5;
      text-align: center;
      animation: fadeUp .55s ease 1.65s both;
    }
    .intro-song-title {
      font-size: clamp(1.1rem, 2.6vw, 1.9rem); font-weight: 700;
      color: #fff;
      text-shadow: 0 0 30px #ffffff30;
      margin-top: 14px;
    }
    .intro-song-artist {
      font-size: clamp(.8rem, 1.7vw, 1.15rem);
      color: #ffffff55; margin-top: 6px; letter-spacing: 1px;
    }

    /* Barra de progresso */
    #intro-progress {
      position: absolute; bottom: 0; left: 0;
      height: 5px;
      background: linear-gradient(90deg, #7c4dff, #e040fb, #00e5ff, #7c4dff);
      background-size: 300% 100%;
      animation: shimmer 1.2s linear infinite;
      width: 0%;
      transition: width linear;
      box-shadow: 0 0 12px #e040fb80;
    }
    @keyframes shimmer {
      from { background-position: 0% 0%; }
      to   { background-position: 300% 0%; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="idle-screen">
    <img src="../assets/logo/logo_voxly.png" alt="Voxly">
    <div id="idle-sub">Aguardando próxima música...</div>
  </div>

  <video id="video-player" controls></video>
  <audio id="preview-audio"   style="display:none;"></audio>
  <audio id="intervalo-audio" style="display:none;"></audio>

  <div id="preview-overlay">
    <div id="prev-waveform"></div>
    <div class="preview-label">🎤 Próxima Música</div>
    <div id="prev-avatars"></div>
    <div class="preview-song"   id="prev-song">—</div>
    <div class="preview-artist" id="prev-artist">—</div>
    <div class="preview-singer" id="prev-singer">—</div>
    <div class="timer-wrap">
      <svg class="timer-svg" viewBox="0 0 110 110">
        <circle class="timer-track" cx="55" cy="55" r="50"/>
        <circle class="timer-arc"   cx="55" cy="55" r="50" id="timer-arc"/>
      </svg>
      <div class="timer-num" id="timer-circle">15</div>
    </div>
    <div class="preview-msg">Confirme no seu celular para cantar!</div>
    <div id="prev-music-bar"></div>
  </div>

  <!-- Intro animação -->
  <div id="intro-overlay">
    <div id="intro-bg"></div>
    <div id="intro-rays"></div>
    <div id="intro-flash"></div>
    <div id="intro-scanline"></div>

    <div class="intro-badge" id="intro-badge">🎵 Próximo no palco</div>
    <div class="intro-avatars" id="intro-avatars"></div>
    <div class="intro-names"   id="intro-names"></div>
    <div class="intro-divider" id="intro-divider"></div>
    <div class="intro-song">
      <div class="intro-song-title"  id="intro-song-title"></div>
      <div class="intro-song-artist" id="intro-song-artist"></div>
    </div>
    <div id="intro-progress"></div>
  </div>

  <div class="qr-corner" id="qr-app">
    <img id="qrImgApp" src="" alt="QR App">
    <div class="qr-corner-label">📱 Acesse o App</div>
  </div>

  <div class="qr-corner" id="qr-sessao">
    <img id="qrImgSessao" src="" alt="QR Sessão">
    <div class="qr-corner-label">🎤 Entre na Sessão</div>
  </div>

  <footer class="footer">
    Desenvolvido por <strong>diSouz4</strong> para <strong>Nexus Solutions</strong>
  </footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const video = document.getElementById("video-player");
  const idle  = document.getElementById("idle-screen");
  const introOverlay  = document.getElementById("intro-overlay");
  const introProgress = document.getElementById("intro-progress");

  const INTRO_DURATION = 5000;
  let introTimeout  = null;
  let particleTimer = null;

  function toFileUrl(filePath) {
    return encodeURI("file://" + filePath);
  }

  // ── Raios de spotlight ──────────────────────────────────
  function criarRaios() {
    const raysEl = document.getElementById("intro-rays");
    raysEl.innerHTML = "";
    const angles = [-40, -22, -8, 0, 8, 22, 40];
    angles.forEach((ang, i) => {
      const ray = document.createElement("div");
      ray.className = "intro-ray";
      ray.style.transform = `rotate(${ang}deg)`;
      ray.style.animationDelay = `${(i * 0.18).toFixed(2)}s`;
      ray.style.animationDuration = `${2.5 + i * 0.3}s`;
      ray.style.opacity = `${0.3 + Math.random() * 0.4}`;
      const colors = ["#e040fb", "#7c4dff", "#00e5ff"];
      ray.style.background = `linear-gradient(to top, ${colors[i % 3]}40, transparent)`;
      raysEl.appendChild(ray);
    });
  }

  // ── Partículas flutuantes ────────────────────────────────
  function iniciarParticulas() {
    clearInterval(particleTimer);
    const overlay = introOverlay;
    const cores = ["#e040fb", "#7c4dff", "#00e5ff", "#ffffff"];
    particleTimer = setInterval(() => {
      if (!introOverlay.classList.contains("active")) { clearInterval(particleTimer); return; }
      const p = document.createElement("div");
      p.className = "intro-particle";
      const size = 3 + Math.random() * 6;
      p.style.width  = size + "px";
      p.style.height = size + "px";
      p.style.left   = (10 + Math.random() * 80) + "%";
      p.style.bottom = "-10px";
      p.style.background = cores[Math.floor(Math.random() * cores.length)];
      p.style.boxShadow  = `0 0 ${size * 2}px ${p.style.background}`;
      const dur = 3 + Math.random() * 4;
      p.style.animationDuration  = dur + "s";
      p.style.animationDelay     = (Math.random() * .5) + "s";
      overlay.appendChild(p);
      setTimeout(() => p.remove(), (dur + 1) * 1000);
    }, 180);
  }

  // ── Avatar HTML (background-image evita problemas de CSP) ──
  function avatarWrap(nome, url, cls) {
    const inner = url
      ? `<div class="intro-avatar-img" style="background-image:url('${url}')"></div>`
      : `<div class="intro-avatar-placeholder">${(nome||'?')[0].toUpperCase()}</div>`;
    return `<div class="intro-avatar-wrap ${cls}">
      <div class="intro-avatar-pulse"></div>
      <div class="intro-avatar-ring"></div>
      ${inner}
    </div>`;
  }

  // ── Nomes letra por letra ────────────────────────────────
  function nomeHtml(nome, baseDelay) {
    const chars = nome.split("").map((ch, i) => {
      const d = (baseDelay + i * 0.045).toFixed(3);
      if (ch === " ") return `<span class="intro-name-space"></span>`;
      return `<span class="intro-name-char" style="animation-delay:${d}s">${ch}</span>`;
    }).join("");
    return `<div class="intro-name">${chars}</div>`;
  }

  // ── Reinicia animações clonando o elemento ───────────────
  function resetAnim(el) {
    const clone = el.cloneNode(true);
    el.parentNode.replaceChild(clone, el);
    return clone;
  }

  // ── Mostrar intro ────────────────────────────────────────
  function mostrarIntro(cantor, duo, musica, artista, photoURL, duoPhotoURL, onDone) {
    clearTimeout(introTimeout);
    clearInterval(particleTimer);

    // Reinicia elementos com animação para disparar novamente
    const scanEl = document.getElementById("intro-scanline");
    if (scanEl) resetAnim(scanEl);
    const flashEl = document.getElementById("intro-flash");
    if (flashEl) resetAnim(flashEl);
    const badgeEl = document.getElementById("intro-badge");
    if (badgeEl) resetAnim(badgeEl);
    const dividerEl = document.getElementById("intro-divider");
    if (dividerEl) resetAnim(dividerEl);

    // Avatares
    const avatarsEl = document.getElementById("intro-avatars");
    if (duo) {
      avatarsEl.innerHTML =
        avatarWrap(cantor, photoURL, "duo-left") +
        `<div class="intro-amp">&amp;</div>` +
        avatarWrap(duo, duoPhotoURL, "duo-right");
    } else {
      avatarsEl.innerHTML = avatarWrap(cantor, photoURL, "solo");
    }

    // Nomes
    const namesEl = document.getElementById("intro-names");
    if (duo) {
      namesEl.innerHTML =
        nomeHtml(cantor, 1.0) +
        `<div class="intro-duo-sep">e</div>` +
        nomeHtml(duo, 1.3);
    } else {
      namesEl.innerHTML = nomeHtml(cantor, 1.0);
    }

    // Música
    document.getElementById("intro-song-title").textContent  = musica  || "";
    document.getElementById("intro-song-artist").textContent = artista || "";

    // Raios e progresso
    criarRaios();

    const prog = document.getElementById("intro-progress");
    prog.style.transition = "none";
    prog.style.width = "0%";

    introOverlay.classList.add("active");
    iniciarParticulas();

    requestAnimationFrame(() => requestAnimationFrame(() => {
      prog.style.transition = `width ${INTRO_DURATION}ms linear`;
      prog.style.width = "100%";
    }));

    introTimeout = setTimeout(() => {
      introOverlay.classList.remove("active");
      clearInterval(particleTimer);
      onDone();
    }, INTRO_DURATION);
  }

  // ── Músicas de intervalo (idle screen) ──────────────────────
  const intervaloAudio = document.getElementById("intervalo-audio");
  const intervaloFaixas = [
    "../assets/intervalo/Intervalo Animado.mp3",
    "../assets/intervalo/Pausa Animada.mp3",
    "../assets/intervalo/Pausa de Karaokê.mp3"
  ];
  let intervaloIdx = Math.floor(Math.random() * intervaloFaixas.length);

  function tocarIntervalo() {
    intervaloAudio.src    = intervaloFaixas[intervaloIdx];
    intervaloAudio.volume = 0.5;
    intervaloAudio.play().catch(() => {});
  }

  function pararIntervalo() {
    intervaloAudio.pause();
    intervaloAudio.src = "";
  }

  intervaloAudio.addEventListener("ended", () => {
    intervaloIdx = (intervaloIdx + 1) % intervaloFaixas.length;
    tocarIntervalo();
  });

  // Começa quando a página carrega (idle screen visível)
  tocarIntervalo();

  // QR do app
  const APP_URL = "https://voxly-karaoke.web.app";
  document.getElementById("qrImgApp").src =
    `https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(APP_URL)}`;

  // Play video (canal legado)
  window.electronAPI.onPlayVideo(filePath => {
    idle.style.display  = "none";
    video.style.display = "block";
    video.src = toFileUrl(filePath);
    video.load();
    video.play().catch(e => console.error("[PLAYER] Erro ao tocar:", e));
  });

  const previewOverlay = document.getElementById("preview-overlay");
  const previewAudio   = document.getElementById("preview-audio");
  const timerCircle    = document.getElementById("timer-circle");
  const timerArc       = document.getElementById("timer-arc");
  const TIMER_CIRCUNF  = 314; // 2π × r50
  let timerInterval    = null;
  let prevTotalSecs    = 15;

  // ── Waveform decorativa ──────────────────────────────────
  (function criarWaveform() {
    const el = document.getElementById("prev-waveform");
    for (let i = 0; i < 60; i++) {
      const b = document.createElement("div");
      b.className = "wave-bar";
      const h = 20 + Math.random() * 40;
      b.style.height = h + "px";
      b.style.animationDuration  = (.4 + Math.random() * .6) + "s";
      b.style.animationDelay     = (Math.random() * .6) + "s";
      el.appendChild(b);
    }
  })();

  // ── Avatar preview ───────────────────────────────────────
  function prevAvatarHtml(nome, url, delay) {
    const style = `animation-delay:${delay}s`;
    if (url) return `<div class="prev-avatar" style="background-image:url('${url}');${style}"></div>`;
    const ini = (nome||'?')[0].toUpperCase();
    return `<div class="prev-avatar-placeholder" style="${style}">${ini}</div>`;
  }

  function atualizarPrevAvatares(cantor, duo, photoURL, duoPhotoURL) {
    const el = document.getElementById("prev-avatars");
    if (duo) {
      el.innerHTML = prevAvatarHtml(cantor, photoURL, 0) +
        `<div class="prev-amp">&amp;</div>` +
        prevAvatarHtml(duo, duoPhotoURL, .12);
    } else {
      el.innerHTML = prevAvatarHtml(cantor, photoURL, 0);
    }
  }

  // ── TTS — chamada por voz ────────────────────────────────
  function chamarPorVoz(cantor, duo) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const texto = duo
      ? `Próximos no palco: ${cantor} e ${duo}! Confirmem no celular.`
      : `Próximo no palco: ${cantor}! Confirme no celular para cantar.`;
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang  = 'pt-BR';
    fala.rate  = 0.88;
    fala.pitch = 1.05;
    fala.volume = 1;
    // Tenta usar voz pt-BR se disponível
    const vozes = speechSynthesis.getVoices();
    const vozPT = vozes.find(v => v.lang.startsWith('pt')) || vozes[0];
    if (vozPT) fala.voice = vozPT;
    speechSynthesis.speak(fala);
  }

  // ── Timer SVG ────────────────────────────────────────────
  function atualizarTimerSVG(restante, total) {
    const frac = restante / total;
    timerArc.style.strokeDashoffset = TIMER_CIRCUNF * (1 - frac);
    if (restante <= 5) {
      timerArc.classList.add("urgente");
      timerCircle.classList.add("urgente");
    }
  }

  function pararPreview() {
    previewAudio.pause();
    previewAudio.src = "";
    previewOverlay.classList.remove("active");
    clearInterval(timerInterval);
    if (window.speechSynthesis) speechSynthesis.cancel();
    // reset arc
    timerArc.style.strokeDashoffset = 0;
    timerArc.classList.remove("urgente");
    timerCircle.classList.remove("urgente");
  }

  function iniciarVideo(filePath) {
    pararIntervalo();
    idle.style.display  = "none";
    video.style.display = "block";
    video.pause();
    video.removeAttribute("src");
    video.load();
    video.src = toFileUrl(filePath);
    video.load();
    video.play().catch(e => console.error("[PLAYER] Erro:", e));
  }

  // Comandos do host
  window.electronAPI.onPlayerCmd(cmd => {
    if (cmd.startsWith("{")) {
      try {
        const dados = JSON.parse(cmd);

        if (dados.cmd === "sessao-iniciada") {
          const sessaoUrl = `${APP_URL}/profile.html?sessao=${dados.codigo}`;
          document.getElementById("qrImgSessao").src =
            `https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(sessaoUrl)}`;
          document.getElementById("qr-sessao").style.display = "flex";
          return;
        }

        if (dados.cmd === "preview") {
          intervaloAudio.volume = 0.15; // abaixa durante o preview/voz
          const cantor = dados.cantor || "—";
          const duo    = dados.duo    || null;

          document.getElementById("prev-song").textContent   = dados.musica  || "—";
          document.getElementById("prev-artist").textContent = dados.artista || "—";
          document.getElementById("prev-singer").textContent = duo
            ? `🎤 ${cantor} & ${duo}`
            : `🎤 ${cantor}`;

          atualizarPrevAvatares(cantor, duo, dados.photoURL || null, dados.duoPhotoURL || null);
          previewOverlay.classList.add("active");

          // Música de fundo a partir do segundo 30 — volume moderado
          if (dados.filePath) {
            previewAudio.src    = toFileUrl(dados.filePath) + "#t=30";
            previewAudio.volume = 0.45;
            previewAudio.play().catch(() => {});

            // barra de progresso da música (15s visíveis)
            const bar = document.getElementById("prev-music-bar");
            bar.style.transition = "none"; bar.style.width = "0%";
            requestAnimationFrame(() => requestAnimationFrame(() => {
              bar.style.transition = `width ${(dados.segundos || 15)}s linear`;
              bar.style.width = "100%";
            }));
          }

          // Chamada por voz — aguarda 0.8s para o TTS não sobrepor o fade-in
          setTimeout(() => chamarPorVoz(cantor, duo), 800);

          // Timer regressivo
          prevTotalSecs = dados.segundos || 15;
          let segundos  = prevTotalSecs;
          timerCircle.textContent = segundos;
          timerArc.style.strokeDashoffset = 0;
          timerArc.classList.remove("urgente");
          timerCircle.classList.remove("urgente");
          clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            segundos--;
            timerCircle.textContent = segundos;
            atualizarTimerSVG(segundos, prevTotalSecs);
            if (segundos <= 0) { clearInterval(timerInterval); pararPreview(); }
          }, 1000);
        }

        if (dados.cmd === "play-confirmed") {
          pararPreview();
          pararIntervalo();
          mostrarIntro(
            dados.cantor      || "Cantor",
            dados.duo         || null,
            dados.musica      || "",
            dados.artista     || "",
            dados.photoURL    || null,
            dados.duoPhotoURL || null,
            () => iniciarVideo(dados.filePath)
          );
        }
      } catch(e) {
        console.error("[PLAYER] Erro JSON cmd:", e);
      }
      return;
    }

    if (cmd === "play")             video.play();
    if (cmd === "pause")            video.pause();
    if (cmd === "stop-preview")     pararPreview();
    if (cmd === "fullscreen")       document.documentElement.requestFullscreen?.();
    if (cmd === "sessao-encerrada") {
      document.getElementById("qr-sessao").style.display = "none";
      document.getElementById("qrImgSessao").src = "";
    }
    if (cmd === "stop") {
      pararPreview();
      clearTimeout(introTimeout);
      clearInterval(particleTimer);
      introOverlay.classList.remove("active");
      video.pause();
      video.removeAttribute("src");
      video.load();
      video.style.display = "none";
      idle.style.display  = "flex";
      tocarIntervalo();
    }
  });

  video.addEventListener("ended", () => {
    video.style.display = "none";
    idle.style.display  = "flex";
    tocarIntervalo();
    window.electronAPI.songEnded();
  });

  video.addEventListener("timeupdate", () => {
    if (video.duration && video.currentTime >= video.duration - 0.5) {
      if (video.style.display !== "none") {
        video.style.display = "none";
        idle.style.display  = "flex";
        window.electronAPI.songEnded();
      }
    }
  });
}); // DOMContentLoaded
</script>
</body>
</html>
