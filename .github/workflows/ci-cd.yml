name: Voxly CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- Testes ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: app
      - name: Lint
        run: npm run lint --if-present
        working-directory: app

  # ---- Build Docker ----
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            # SHA longo: e por ele que o security-scan procura a imagem.
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Build Electron (Windows) ----
  build-electron-win:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: app
      - name: Build Electron (Windows)
        run: npm run build:win -- --publish never
        working-directory: app
      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: voxly-windows
          path: |
            app/dist/*.exe
            app/dist/latest.yml
            app/dist/*.blockmap
          retention-days: 7

  # ---- Build Electron (Linux) ----
  build-electron-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: app
      - name: Build Electron (Linux)
        run: npm run build:linux -- --publish never
        working-directory: app
      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: voxly-linux
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/latest-linux.yml
            app/dist/*.blockmap
          retention-days: 7

  # ---- Build Electron (macOS) ----
  build-electron-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: app
      - name: Build Electron (macOS)
        run: npm run build:mac -- --publish never
        working-directory: app
      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: voxly-macos
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.app
          retention-days: 7

  # ---- Publish Electron Releases ----
  release:
    needs: [build-electron-linux, build-electron-win, build-electron-mac]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create releases and upload assets
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: voxly-linux
          path: ./dist/linux
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: voxly-windows
          path: ./dist/windows
      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: voxly-macos
          path: ./dist/macos
      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./dist/linux/*.AppImage
            ./dist/linux/*.deb
            ./dist/linux/latest-linux.yml
            ./dist/linux/*.blockmap
            ./dist/windows/*.exe
            ./dist/windows/latest.yml
            ./dist/windows/*.blockmap
            ./dist/macos/*.dmg
            ./dist/macos/*.zip

  # ---- Deploy Web (Firebase Hosting) ----
  deploy-web-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Firebase Tools
        run: npm install -g firebase-tools
      - name: Deploy para staging
        run: firebase deploy --only hosting -P voxly-karaoke
        working-directory: web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-web-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Firebase Tools
        run: npm install -g firebase-tools
      - name: Deploy para producao
        run: firebase deploy --only hosting -P voxly-karaoke
        working-directory: web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ---- Verificacao de Seguranca ----
  security-scan:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A imagem fica no registro privado do repositorio: sem login, o Trivy nao
    # conseguia baixa-la e o job falhava sempre — marcando todo run como
    # vermelho e escondendo falha de verdade.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Entrar no registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan imagem Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
